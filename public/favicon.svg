<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c382b" />
      <stop offset="60%" stop-color="#164d3e" />
      <stop offset="100%" stop-color="#226652" />
    </linearGradient>
    <linearGradient id="fh-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="fh-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base with Emerald Gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fh-bg)" stroke="#2d7a64" stroke-width="1.5" />

  <!-- Subtle Inner Ring Highlight -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="13" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1" />

  <!-- Central Fetena Hub Mark: Bold 'F' + Academic Cap Wing + Radiant Gold Spark -->
  <g filter="url(#fh-shadow)">
    <!-- Vertical stem of F -->
    <rect x="15" y="14" width="8" height="36" rx="4" fill="#FFFFFF" />

    <!-- Top horizontal beam (curved academic cap silhouette) -->
    <path d="M15 18C15 15.79 16.79 14 19 14H42C44.21 14 46 15.79 46 18C46 20.21 44.21 22 42 22H19C16.79 22 15 20.21 15 18Z" fill="#FFFFFF" />

    <!-- Dynamic Middle Crossbar in Radiant Gold -->
    <path d="M15 31C15 29.34 16.34 28 18 28H34C35.66 28 37 29.34 37 31C37 32.66 35.66 34 34 34H18C16.34 34 15 32.66 15 31Z" fill="url(#fh-gold)" />

    <!-- Academic Excellence / Hub Spark Star -->
    <path d="M47 13 L48.6 17.4 L53 19 L48.6 20.6 L47 25 L45.4 20.6 L41 19 L45.4 17.4 Z" fill="url(#fh-gold)" />
  </g>
</svg>